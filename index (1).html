<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Rentabilidad MVP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--border:#2a2a3a;
  --purple:#8b5cf6;--purple2:#7c3aed;--green:#10b981;--red:#ef4444;
  --blue:#3b82f6;--text:#ffffff;--text2:#a1a1aa;--text3:#6b7280;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
.hidden{display:none!important}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--purple),var(--blue));border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
.auth-logo h1{font-size:22px;font-weight:700}
.auth-logo p{color:var(--text2);font-size:14px;margin-top:4px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.form-group input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;transition:border .2s}
.form-group input:focus{border-color:var(--purple)}
.btn{width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;margin-top:6px}
.btn-primary{background:var(--purple);color:white}
.btn-primary:hover{background:var(--purple2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)!important;border:none}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text2)}
.auth-switch a{color:var(--purple);cursor:pointer;font-weight:500;text-decoration:none}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#ef4444;margin-bottom:14px}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sb-logo{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--purple),var(--blue));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-name{font-size:14px;font-weight:700}
.sb-sub{font-size:10px;color:var(--text3)}
.sb-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(139,92,246,.15);color:var(--purple)}
.nav-item .icon{font-size:15px}
.sb-user{padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-av{width:32px;height:32px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.user-inf{flex:1;min-width:0}
.user-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-em{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px;border-radius:4px}
.logout-btn:hover{color:var(--red)}
.main{margin-left:220px;flex:1}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:8px}
.sel{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px;cursor:pointer;outline:none}
.badge{background:rgba(139,92,246,.2);color:var(--purple);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700}
.content{padding:24px}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative}
.kpi-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:800;line-height:1}
.kpi-val.green{color:var(--green)}
.kpi-val.red{color:var(--red)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:6px}
.kpi-ico{position:absolute;top:14px;right:14px;font-size:18px;opacity:.5}

/* BANNER */
.banner{border-radius:10px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:13px;font-weight:500}
.banner.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.banner.bad{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}

/* SECTION */
.sec-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:17px;font-weight:700}
.sec-sub{font-size:12px;color:var(--text3);margin-top:2px}
.add-btn{display:flex;align-items:center;gap:6px;background:var(--purple);color:white;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.add-btn:hover{background:var(--purple2)}

/* DAY ROWS */
.day-row{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.day-hdr{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s;user-select:none}
.day-hdr:hover{background:var(--bg3)}
.chev{font-size:11px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.chev.open{transform:rotate(90deg)}
.day-num{font-size:14px;font-weight:700;min-width:55px}
.day-stats{display:flex;align-items:center;gap:14px;flex:1;flex-wrap:wrap}
.ds{font-size:12px;color:var(--text2)}
.ds b{font-weight:600}
.ds b.g{color:var(--green)}
.ds b.r{color:var(--red)}
.day-empty{font-size:12px;color:var(--text3);font-style:italic}
.day-body{border-top:1px solid var(--border);padding:14px 16px}
.det-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.det-table th{text-align:left;color:var(--text3);font-weight:600;padding:5px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.det-table td{padding:7px 8px;border-top:1px solid var(--border);color:var(--text2)}
.det-table td.g{color:var(--green);font-weight:600}
.det-table td.r{color:var(--red);font-weight:600}
.add-form{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-top:8px}
.mini-fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.mini-fg label{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase}
.mini-fg input,.mini-fg select{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:13px;outline:none;width:100%}
.mini-fg input:focus,.mini-fg select:focus{border-color:var(--purple)}
.btn-sm{padding:7px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-sm.pu{background:var(--purple);color:white}
.btn-sm.pu:hover{background:var(--purple2)}
.btn-sm.gr{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.btn-sm.rd{background:rgba(239,68,68,.15);color:var(--red)}
.btn-sm.rd:hover{background:rgba(239,68,68,.25)}
.open-add-btn{background:none;border:1px dashed var(--border);border-radius:6px;color:var(--text3);cursor:pointer;padding:6px 12px;font-size:12px;width:100%;transition:all .15s}
.open-add-btn:hover{border-color:var(--purple);color:var(--purple)}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--text3);font-weight:600;padding:9px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.name{color:var(--text);font-weight:600}
.tbl td.g{color:var(--green);font-weight:600}
.tbl td.r{color:var(--red);font-weight:600}
.act-btns{display:flex;gap:6px}
.ico-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:4px;color:var(--text3);font-size:14px;transition:all .15s}
.ico-btn:hover{background:var(--bg3);color:var(--text)}
.ico-btn.del:hover{color:var(--red)}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:22px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-acts{display:flex;gap:10px;margin-top:20px}
.modal-acts .btn{flex:1;margin-top:0}

/* PLAN */
.plan-box{text-align:center;padding:8px}
.plan-ico{font-size:40px;margin-bottom:14px}
.plan-ttl{font-size:18px;font-weight:700;margin-bottom:10px}
.plan-desc{color:var(--text2);font-size:14px;margin-bottom:20px;line-height:1.6}
.plan-desc span{color:var(--purple);font-weight:600}
.btn-wa{background:#25d366;color:white;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:all .15s}
.btn-wa:hover{background:#1ebe5d}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--green);border-radius:10px;padding:11px 16px;font-size:13px;color:var(--green);z-index:2000;animation:si .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.err{border-color:var(--red);color:var(--red)}
@keyframes si{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* CONFIG */
.rate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px}
.rate-lbl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.rate-inp{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:14px;font-weight:600;outline:none}
.rate-inp:focus{border-color:var(--purple)}
.rate-ref{font-size:11px;color:var(--text3);margin-top:4px}

/* IMPORT */
.sheets-row{display:flex;gap:8px;margin-top:12px}
.sheets-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.sheets-row input:focus{border-color:var(--purple)}
.sync-result{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px}
.sync-result.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.sync-result.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}

/* PROFIT BARS */
.pbar-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.pbar-top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.pbar-name{font-weight:600}
.pbar-track{background:var(--border);border-radius:4px;height:6px;margin-bottom:6px}
.pbar-fill{background:var(--purple);height:6px;border-radius:4px;transition:width .3s}
.pbar-stats{display:flex;gap:14px;font-size:11px;color:var(--text3)}

/* EMPTY */
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty-ico{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--text3);font-size:14px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* VENTAS KPIS */
.vkpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.vkpi{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px}
.vkpi-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;font-weight:600;margin-bottom:6px}
.vkpi-val{font-size:22px;font-weight:800}
.vkpi-val.g{color:var(--green)}
.vkpi-val.r{color:var(--red)}

@media(max-width:768px){
.sidebar{display:none}.main{margin-left:0}
.kpi-grid{grid-template-columns:repeat(2,1fr)}
.vkpi-grid{grid-template-columns:1fr}
.rate-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-icon">⚡</div>
      <h1>Rentabilidad MVP</h1>
      <p id="auth-subtitle">Inicia sesión para continuar</p>
    </div>
    <div id="auth-error" class="error-msg hidden"></div>
    <div id="name-group" class="form-group hidden">
      <label>NOMBRE COMPLETO</label>
      <input id="inp-name" type="text" placeholder="Tu nombre"/>
    </div>
    <div class="form-group">
      <label>EMAIL</label>
      <input id="inp-email" type="email" placeholder="tu@email.com"/>
    </div>
    <div class="form-group">
      <label>CONTRASEÑA</label>
      <input id="inp-pass" type="password" placeholder="••••••••"/>
    </div>
    <button class="btn btn-primary" id="auth-btn">Iniciar sesión</button>
    <div class="auth-switch" id="auth-switch">
      ¿No tienes cuenta? <a id="auth-toggle">Crear cuenta</a>
    </div>
  </div>
</div>

<div id="app-screen" class="app hidden">
  <div class="sidebar">
    <div class="sb-logo">
      <div class="sb-icon">⚡</div>
      <div><div class="sb-name">Rentabilidad</div><div class="sb-sub">MVP</div></div>
    </div>
    <div class="sb-nav">
      <div class="nav-item active" data-page="dashboard"><span class="icon">📊</span> Dashboard</div>
      <div class="nav-item" data-page="ventas"><span class="icon">🛒</span> Ventas</div>
      <div class="nav-item" data-page="productos"><span class="icon">📦</span> Productos</div>
      <div class="nav-item" data-page="importar"><span class="icon">📥</span> Importar Excel</div>
      <div class="nav-item" data-page="config"><span class="icon">⚙️</span> Configuración</div>
    </div>
    <div class="sb-user">
      <div class="user-av" id="user-av">U</div>
      <div class="user-inf">
        <div class="user-nm" id="user-nm">Usuario</div>
        <div class="user-em" id="user-em">email</div>
      </div>
      <button class="logout-btn" id="logout-btn" title="Cerrar sesión">⎋</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-right">
        <select class="sel" id="sel-year"></select>
        <select class="sel" id="sel-month">
          <option value="1">Ene</option><option value="2">Feb</option><option value="3">Mar</option>
          <option value="4">Abr</option><option value="5">May</option><option value="6">Jun</option>
          <option value="7">Jul</option><option value="8">Ago</option><option value="9">Sep</option>
          <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dic</option>
        </select>
        <span class="badge">MVP V1.0</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="overlay hidden">
  <div class="modal" id="modal-box"></div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script>
const SUPA_URL = 'https://psrrwrpquvgofvimjwoy.supabase.co';
const SUPA_KEY = 'sb_publishable_CEhqdmQeLsc1EqdHuCL57Q_71UWzOnq';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentUser = null;
let currentProfile = null;
let currentPage = 'dashboard';
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let openDays = new Set();
let addingDay = null;
let editingRecId = null;

const $ = id => document.getElementById(id);
const fmt = n => '$' + (parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const getDays = (y,m) => new Date(y,m,0).getDate();
const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function showToast(msg, type='success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (type==='error'?' err':'');
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

function showModal(html) {
  $('modal-box').innerHTML = html;
  $('modal').classList.remove('hidden');
}

function closeModal() {
  $('modal').classList.add('hidden');
}

$('modal').addEventListener('click', e => { if(e.target === $('modal')) closeModal(); });

// AUTH
let authMode = 'login';

$('auth-toggle').addEventListener('click', () => {
  authMode = authMode === 'login' ? 'register' : 'login';
  $('auth-subtitle').textContent = authMode === 'login' ? 'Inicia sesión para continuar' : 'Crea tu cuenta para empezar';
  $('auth-btn').textContent = authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
  $('auth-toggle').textContent = authMode === 'login' ? 'Crear cuenta' : 'Iniciar sesión';
  $('auth-switch').innerHTML = authMode === 'login' ? '¿No tienes cuenta? <a id="auth-toggle">Crear cuenta</a>' : '¿Ya tienes cuenta? <a id="auth-toggle">Iniciar sesión</a>';
  $('name-group').classList.toggle('hidden', authMode === 'login');
  $('auth-error').classList.add('hidden');
  $('auth-toggle').addEventListener('click', arguments.callee.bind(this));
});

$('auth-btn').addEventListener('click', async () => {
  const email = $('inp-email').value.trim();
  const pass = $('inp-pass').value;
  const name = $('inp-name')?.value?.trim() || '';
  $('auth-error').classList.add('hidden');
  $('auth-btn').textContent = 'Cargando...';
  $('auth-btn').disabled = true;
  try {
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      await initApp(data.user);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
      if (error) throw error;
      if (data.user) {
        await sb.from('profiles').upsert({ id: data.user.id, email, full_name: name, plan: 'free' }, { onConflict: 'id' });
        await initApp(data.user);
      }
    }
  } catch(e) {
    $('auth-error').textContent = e.message;
    $('auth-error').classList.remove('hidden');
  }
  $('auth-btn').textContent = authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
  $('auth-btn').disabled = false;
});

$('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') $('auth-btn').click(); });

async function initApp(user) {
  currentUser = user;
  const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = prof || { plan: 'free' };
  $('auth-screen').classList.add('hidden');
  $('app-screen').classList.remove('hidden');
  const init = user.email[0].toUpperCase();
  $('user-av').textContent = init;
  $('user-nm').textContent = prof?.full_name || user.email;
  $('user-em').textContent = user.email;
  setupSelects();
  setupNav();
  renderPage();
}

function setupSelects() {
  const sy = $('sel-year');
  sy.innerHTML = '';
  [2024,2025,2026,2027].forEach(y => {
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    if(y === currentYear) o.selected = true;
    sy.appendChild(o);
  });
  $('sel-month').value = currentMonth;
  sy.addEventListener('change', () => { currentYear = parseInt(sy.value); renderPage(); });
  $('sel-month').addEventListener('change', () => { currentMonth = parseInt($('sel-month').value); renderPage(); });
}

function setupNav() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      currentPage = el.dataset.page;
      const titles = { dashboard:'Dashboard', ventas:'Ventas', productos:'Productos', importar:'Importar Excel', config:'Configuración' };
      $('topbar-title').textContent = titles[currentPage];
      renderPage();
    });
  });
}

$('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  currentUser = null; currentProfile = null;
  $('app-screen').classList.add('hidden');
  $('auth-screen').classList.remove('hidden');
});

function renderPage() {
  openDays = new Set(); addingDay = null; editingRecId = null;
  if(currentPage==='dashboard') renderDashboard();
  else if(currentPage==='ventas') renderVentas();
  else if(currentPage==='productos') renderProductos();
  else if(currentPage==='importar') renderImportar();
  else if(currentPage==='config') renderConfig();
}

// ---- DASHBOARD ----
async function renderDashboard() {
  const c = $('content');
  c.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando...</div>';
  const days = getDays(currentYear, currentMonth);
  const from = `${currentYear}-${String(currentMonth).padStart(2,'0')}-01`;
  const to = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(days).padStart(2,'0')}`;
  const [{ data: records }, { data: products }] = await Promise.all([
    sb.from('daily_records').select('*, products(name)').gte('date',from).lte('date',to).eq('user_id',currentUser.id).order('date'),
    sb.from('products').select('*').eq('user_id',currentUser.id).eq('active',true)
  ]);
  const recs = records || [];
  const prods = products || [];

  const totalRev = recs.reduce((s,r) => s+(parseFloat(r.revenue_usd)||0), 0);
  const totalAds = recs.reduce((s,r) => s+(parseFloat(r.ad_spend_usd)||0), 0);
  const profit = totalRev - totalAds;
  const roas = totalAds > 0 ? totalRev/totalAds : 0;
  const margin = totalRev > 0 ? (profit/totalRev)*100 : 0;
  const activeDays = [...new Set(recs.map(r=>r.date))].length;

  let html = `
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">USD · Inversión Total Ads</div><div class="kpi-val">${fmt(totalAds)}</div><div class="kpi-sub">${activeDays} días activos</div><div class="kpi-ico">$</div></div>
    <div class="kpi-card"><div class="kpi-label">USD · Facturación Total</div><div class="kpi-val">${fmt(totalRev)}</div><div class="kpi-sub">Margen: ${margin.toFixed(1)}%</div><div class="kpi-ico">📋</div></div>
    <div class="kpi-card"><div class="kpi-label">USD · ROAS Total</div><div class="kpi-val ${roas>=2?'green':'red'}">${roas.toFixed(2)}x</div><div class="kpi-sub">Facturación / Inversión</div><div class="kpi-ico">📈</div></div>
    <div class="kpi-card"><div class="kpi-label">USD · Utilidad Real ★</div><div class="kpi-val ${profit>=0?'green':'red'}">${fmt(profit)}</div><div class="kpi-sub">La métrica que importa</div><div class="kpi-ico">✨</div></div>
  </div>`;

  if(totalRev > 0) {
    html += `<div class="banner ${profit>=0?'ok':'bad'}"><span>● ${profit>=0?'Mes rentable':'Mes en pérdida'} — ${fmt(Math.abs(profit))} de ${profit>=0?'utilidad':'pérdida'} — Margen ${margin.toFixed(1)}%</span><span>ROAS ${roas.toFixed(2)}x</span></div>`;
  }

  html += `<div class="sec-hdr"><div><div class="sec-title">Datos Diarios — ${monthNames[currentMonth-1]} ${currentYear}</div><div class="sec-sub">${activeDays} de ${days} días con datos · Valores en USD</div></div></div>`;

  for(let d=1; d<=days; d++) {
    const dr = recs.filter(r => parseInt(r.date.split('-')[2])===d);
    const dRev = dr.reduce((s,r) => s+(parseFloat(r.revenue_usd)||0),0);
    const dAds = dr.reduce((s,r) => s+(parseFloat(r.ad_spend_usd)||0),0);
    const dProfit = dRev - dAds;
    const dRoas = dAds>0 ? dRev/dAds : 0;
    const isOpen = openDays.has(d);

    html += `<div class="day-row" id="day-row-${d}">
      <div class="day-hdr" onclick="toggleDay(${d})">
        <span class="chev ${isOpen?'open'}" id="chev-${d}">▶</span>
        <span class="day-num">Día ${d}</span>
        ${dr.length>0 ? `<div class="day-stats">
          <span class="ds">${dr.length} producto${dr.length>1?'s':''}</span>
          <span class="ds">ADS: <b>${fmt(dAds)}</b></span>
          <span class="ds">FACT: <b>${fmt(dRev)}</b></span>
          <span class="ds">UTIL: <b class="${dProfit>=0?'g':'r'}">${fmt(dProfit)}</b></span>
          <span class="ds">ROAS: <b class="${dRoas>=2?'g':'r'}">${dRoas.toFixed(2)}x</b></span>
        </div>` : '<span class="day-empty">Sin datos</span>'}
      </div>
      <div id="day-body-${d}" style="display:${isOpen?'block':'none'}">
        <div class="day-body">
          ${dr.length>0 ? buildDetTable(dr) : ''}
          ${buildAddForm(d, prods)}
        </div>
      </div>
    </div>`;
  }

  c.innerHTML = html;

  // Store data for later use
  window._dashProds = prods;
  window._dashRecs = recs;
}

function buildDetTable(dr) {
  let t = `<table class="det-table"><thead><tr><th>Producto</th><th>Ads USD</th><th>Fact USD</th><th>ROAS</th><th>Utilidad</th><th></th></tr></thead><tbody>`;
  dr.forEach(r => {
    const p = parseFloat(r.net_profit_usd)||0;
    const ro = parseFloat(r.roas)||0;
    t += `<tr>
      <td style="color:var(--text);font-weight:500">${r.products?.name||'-'}</td>
      <td>${fmt(r.ad_spend_usd)}</td>
      <td>${fmt(r.revenue_usd)}</td>
      <td class="${ro>=2?'g':'r'}">${ro.toFixed(2)}x</td>
      <td class="${p>=0?'g':'r'}">${fmt(p)}</td>
      <td><div class="act-btns">
        <button class="ico-btn" onclick="editRec('${r.id}','${r.product_id}',${r.revenue_usd},${r.ad_spend_usd},${parseInt(r.date.split('-')[2])})">✏️</button>
        <button class="ico-btn del" onclick="delRec('${r.id}')">🗑️</button>
      </div></td>
    </tr>`;
  });
  t += '</tbody></table>';
  return t;
}

function buildAddForm(d, prods) {
  if(addingDay !== d) {
    return `<button class="open-add-btn" onclick="openAdd(${d})">+ Agregar registro</button>`;
  }
  const opts = prods.map(p => `<option value="${p.id}" ${editingRecId&&window._editForm?.product_id===p.id?'selected':''}>${p.name}</option>`).join('');
  return `<div class="add-form">
    <div class="mini-fg"><label>Producto</label><select id="add-prod-${d}"><option value="">Seleccionar...</option>${opts}</select></div>
    <div class="mini-fg"><label>Facturación USD</label><input type="number" id="add-rev-${d}" placeholder="0.00" value="${window._editForm?.revenue_usd||''}"/></div>
    <div class="mini-fg"><label>Gasto Ads USD</label><input type="number" id="add-ads-${d}" placeholder="0.00" value="${window._editForm?.ad_spend_usd||''}"/></div>
    <button class="btn-sm pu" onclick="saveRec(${d})">${editingRecId?'Actualizar':'Guardar'}</button>
    <button class="btn-sm gr" onclick="cancelAdd()">Cancelar</button>
  </div>`;
}

function toggleDay(d) {
  const body = $(`day-body-${d}`);
  const chev = $(`chev-${d}`);
  if(openDays.has(d)) { openDays.delete(d); body.style.display='none'; chev.classList.remove('open'); }
  else { openDays.add(d); body.style.display='block'; chev.classList.add('open'); }
}

function openAdd(d) {
  if(currentProfile?.plan==='free') { showPlanModal(); return; }
  addingDay = d;
  editingRecId = null;
  window._editForm = null;
  openDays.add(d);
  renderDashboard();
}

function cancelAdd() {
  addingDay = null; editingRecId = null; window._editForm = null;
  renderDashboard();
}

function editRec(id, prodId, rev, ads, day) {
  if(currentProfile?.plan==='free') { showPlanModal(); return; }
  editingRecId = id;
  addingDay = day;
  window._editForm = { product_id: prodId, revenue_usd: rev, ad_spend_usd: ads };
  openDays.add(day);
  renderDashboard();
  // Set values after render
  setTimeout(() => {
    const ps = $(`add-prod-${day}`); if(ps) ps.value = prodId;
    const rv = $(`add-rev-${day}`); if(rv) rv.value = rev;
    const ad = $(`add-ads-${day}`); if(ad) ad.value = ads;
  }, 100);
}

async function saveRec(d) {
  const prodId = $(`add-prod-${d}`)?.value;
  const rev = parseFloat($(`add-rev-${d}`)?.value)||0;
  const ads = parseFloat($(`add-ads-${d}`)?.value)||0;
  if(!prodId) { showToast('Selecciona un producto','error'); return; }
  const date = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const payload = { user_id: currentUser.id, product_id: prodId, date, revenue_usd: rev, ad_spend_usd: ads, net_profit_usd: rev-ads, roas: ads>0?rev/ads:0, currency_code:'USD' };
  if(editingRecId) {
    await sb.from('daily_records').update(payload).eq('id', editingRecId);
    showToast('✓ Actualizado');
  } else {
    await sb.from('daily_records').insert(payload);
    showToast('✓ Guardado');
  }
  addingDay=null; editingRecId=null; window._editForm=null;
  renderDashboard();
}

async function delRec(id) {
  if(!confirm('¿Eliminar este registro?')) return;
  await sb.from('daily_records').delete().eq('id', id);
  showToast('✓ Eliminado');
  renderDashboard();
}

// ---- VENTAS ----
async function renderVentas() {
  const c = $('content');
  c.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando...</div>';
  const days = getDays(currentYear, currentMonth);
  const from = `${currentYear}-${String(currentMonth).padStart(2,'0')}-01`;
  const to = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(days).padStart(2,'0')}`;
  const { data: recs } = await sb.from('daily_records').select('*, products(name)').gte('date',from).lte('date',to).eq('user_id',currentUser.id).order('date',{ascending:false});
  const records = recs || [];

  const totalRev = records.reduce((s,r)=>s+(parseFloat(r.revenue_usd)||0),0);
  const totalAds = records.reduce((s,r)=>s+(parseFloat(r.ad_spend_usd)||0),0);
  const profit = totalRev - totalAds;

  const byProd = {};
  records.forEach(r => {
    const k = r.products?.name||'Sin producto';
    if(!byProd[k]) byProd[k]={rev:0,ads:0};
    byProd[k].rev += parseFloat(r.revenue_usd)||0;
    byProd[k].ads += parseFloat(r.ad_spend_usd)||0;
  });

  let html = `<div style="margin-bottom:18px"><div class="sec-title">Ventas — ${monthNames[currentMonth-1]} ${currentYear}</div><div class="sec-sub">Resumen de facturación por producto · Valores en USD</div></div>
  <div class="vkpi-grid">
    <div class="vkpi"><div class="vkpi-lbl">Facturación Total</div><div class="vkpi-val">${fmt(totalRev)}</div></div>
    <div class="vkpi"><div class="vkpi-lbl">Inversión Total</div><div class="vkpi-val">${fmt(totalAds)}</div></div>
    <div class="vkpi"><div class="vkpi-lbl">Utilidad Total</div><div class="vkpi-val ${profit>=0?'g':'r'}">${fmt(profit)}</div></div>
  </div>`;

  if(Object.keys(byProd).length > 0) {
    html += `<div class="card"><div class="card-title">Ventas por Producto (USD)</div><table class="tbl"><thead><tr><th>Producto</th><th>Facturación</th><th>Inversión</th><th>Utilidad</th><th>ROAS</th></tr></thead><tbody>`;
    Object.entries(byProd).forEach(([name,d]) => {
      const p = d.rev-d.ads; const ro = d.ads>0?d.rev/d.ads:0;
      html += `<tr><td class="name">${name}</td><td>${fmt(d.rev)}</td><td>${fmt(d.ads)}</td><td class="${p>=0?'g':'r'}">${fmt(p)}</td><td class="${ro>=2?'g':'r'}">${ro.toFixed(2)}x</td></tr>`;
    });
    html += '</tbody></table></div>';
  }

  html += `<div class="card"><div class="card-title">Todos los Registros</div>`;
  if(records.length===0) { html += '<div class="empty"><div class="empty-ico">📊</div><p>Sin registros este mes</p></div>'; }
  else {
    html += `<table class="tbl"><thead><tr><th>Fecha</th><th>Producto</th><th>Inv USD</th><th>Fact USD</th><th>ROAS</th><th>Utilidad</th><th></th></tr></thead><tbody>`;
    records.forEach(r => {
      const p = (parseFloat(r.revenue_usd)||0)-(parseFloat(r.ad_spend_usd)||0);
      const ro = (parseFloat(r.ad_spend_usd)||0)>0?(parseFloat(r.revenue_usd)||0)/(parseFloat(r.ad_spend_usd)||0):0;
      html += `<tr><td>${r.date}</td><td class="name">${r.products?.name||'-'}</td><td>${fmt(r.ad_spend_usd)}</td><td>${fmt(r.revenue_usd)}</td><td class="${ro>=2?'g':'r'}">${ro.toFixed(2)}x</td><td class="${p>=0?'g':'r'}">${fmt(p)}</td><td><button class="ico-btn del" onclick="delRecV('${r.id}')">🗑️</button></td></tr>`;
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  c.innerHTML = html;
}

async function delRecV(id) {
  if(!confirm('¿Eliminar?')) return;
  await sb.from('daily_records').delete().eq('id', id);
  showToast('✓ Eliminado');
  renderVentas();
}

// ---- PRODUCTOS ----
async function renderProductos() {
  const c = $('content');
  c.innerHTML = '<div class="loading"><div class="spinner"></div> Cargando...</div>';
  const days = getDays(currentYear, currentMonth);
  const from = `${currentYear}-${String(currentMonth).padStart(2,'0')}-01`;
  const to = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(days).padStart(2,'0')}`;
  const [{ data: prods }, { data: recs }] = await Promise.all([
    sb.from('products').select('*').eq('user_id',currentUser.id).eq('active',true).order('created_at'),
    sb.from('daily_records').select('*').gte('date',from).lte('date',to).eq('user_id',currentUser.id)
  ]);
  const products = prods||[], records = recs||[];
  const totalRev = records.reduce((s,r)=>s+(parseFloat(r.revenue_usd)||0),0);

  let html = `<div class="sec-hdr"><div><div class="sec-title">Productos</div><div class="sec-sub">${products.length} productos activos · Valores en USD</div></div>
    <button class="add-btn" onclick="openNewProduct()">+ Nuevo Producto</button></div>
  <div class="card" style="padding:0;overflow:hidden">`;

  if(products.length===0) { html += '<div class="empty"><div class="empty-ico">📦</div><p>No hay productos. Agrega tu primer producto.</p></div>'; }
  else {
    html += `<table class="tbl"><thead><tr><th>Producto</th><th>Inversión USD</th><th>Facturación USD</th><th>ROAS</th><th>Utilidad USD</th><th></th></tr></thead><tbody>`;
    products.forEach(p => {
      const pr = records.filter(r=>r.product_id===p.id);
      const rev = pr.reduce((s,r)=>s+(parseFloat(r.revenue_usd)||0),0);
      const ads = pr.reduce((s,r)=>s+(parseFloat(r.ad_spend_usd)||0),0);
      const prof = rev-ads; const ro = ads>0?rev/ads:0;
      html += `<tr><td class="name">● ${p.name}</td><td>${fmt(ads)}</td><td>${fmt(rev)}</td><td class="${ro>=2?'g':'r'}">${ro.toFixed(2)}x</td><td class="${prof>=0?'g':'r'}">${fmt(prof)}</td><td><div class="act-btns"><button class="ico-btn" onclick="editProd('${p.id}','${p.name.replace(/'/g,"\\'")}',${p.price_usd||0})">✏️</button><button class="ico-btn del" onclick="delProd('${p.id}')">🗑️</button></div></td></tr>`;
    });
    html += '</tbody></table>';
  }
  html += '</div>';

  // Rentabilidad del mes
  html += `<div class="card"><div class="card-title">📈 Rentabilidad del mes — ${monthNames[currentMonth-1]} ${currentYear}</div>`;
  if(records.length===0) { html += `<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Sin registros este mes.</div>`; }
  else {
    products.forEach(p => {
      const pr = records.filter(r=>r.product_id===p.id);
      if(!pr.length) return;
      const rev = pr.reduce((s,r)=>s+(parseFloat(r.revenue_usd)||0),0);
      const ads = pr.reduce((s,r)=>s+(parseFloat(r.ad_spend_usd)||0),0);
      const prof = rev-ads; const ro = ads>0?rev/ads:0;
      const pct = totalRev>0?(rev/totalRev)*100:0;
      html += `<div class="pbar-item">
        <div class="pbar-top"><span class="pbar-name">${p.name}</span><span style="color:${prof>=0?'var(--green)':'var(--red)'};font-weight:700">${fmt(prof)}</span></div>
        <div class="pbar-track"><div class="pbar-fill" style="width:${pct}%"></div></div>
        <div class="pbar-stats"><span>Fact: <b style="color:var(--text)">${fmt(rev)}</b></span><span>Ads: <b style="color:var(--text)">${fmt(ads)}</b></span><span>ROAS: <b style="color:${ro>=2?'var(--green)':'var(--red)'}">${ro.toFixed(2)}x</b></span><span>Part: <b style="color:var(--purple)">${pct.toFixed(1)}%</b></span></div>
      </div>`;
    });
  }
  html += '</div>';
  c.innerHTML = html;
}

function openNewProduct() {
  if(currentProfile?.plan==='free') { showPlanModal(); return; }
  showModal(`
    <div class="modal-hdr"><div class="modal-title">Nuevo Producto</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>NOMBRE DEL PRODUCTO</label><input id="mp-name" type="text" placeholder="ej. Método MVP"/></div>
    <div class="form-group"><label>PRECIO (USD) — OPCIONAL</label><input id="mp-price" type="number" placeholder="ej. 29.99"/></div>
    <div class="modal-acts"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveProd(null)">Guardar</button></div>
  `);
}

function editProd(id, name, price) {
  showModal(`
    <div class="modal-hdr"><div class="modal-title">Editar Producto</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>NOMBRE</label><input id="mp-name" type="text" value="${name}"/></div>
    <div class="form-group"><label>PRECIO (USD)</label><input id="mp-price" type="number" value="${price}"/></div>
    <div class="modal-acts"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveProd('${id}')">Guardar</button></div>
  `);
}

async function saveProd(id) {
  const name = $('mp-name')?.value?.trim();
  const price = parseFloat($('mp-price')?.value)||0;
  if(!name) { showToast('Ingresa el nombre del producto','error'); return; }
  if(id) { await sb.from('products').update({name,price_usd:price}).eq('id',id); showToast('✓ Actualizado'); }
  else { await sb.from('products').insert({user_id:currentUser.id,name,price_usd:price,active:true}); showToast('✓ Creado'); }
  closeModal(); renderProductos();
}

async function delProd(id) {
  if(!confirm('¿Eliminar producto?')) return;
  await sb.from('products').update({active:false}).eq('id',id);
  showToast('✓ Eliminado'); renderProductos();
}

}

async function syncSheet() {
  if(currentProfile?.plan==='free') { showPlanModal(); return; }
  const url = $('sheet-url')?.value?.trim();
  if(!url) { showToast('Ingresa la URL del Sheet','error'); return; }
  const res = $('sync-result');
  res.innerHTML = '<div style="color:var(--text3);font-size:13px;margin-top:10px">⏳ Sincronizando...</div>';
  try {
    const match = url.match(/\/spreadsheets\/d\/([^\/]+)/);
    if(!match) throw new Error('URL inválida de Google Sheets');
    const sheetId = match[1];
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`);
    const text = await r.text();
    const clean = text.replace(/^[^{]*/, '').replace(/[^}]*$/, '');
    const json = JSON.parse(clean);
    const rows = json.table?.rows || [];

    const { data: existProds } = await sb.from('products').select('*').eq('user_id',currentUser.id).eq('active',true);
    const prodMap = {};
    (existProds||[]).forEach(p => { prodMap[p.name.toLowerCase()] = p.id; });

    let imported=0, skipped=0;
    for(const row of rows) {
      try {
        const cells = row.c;
        if(!cells || !cells[0]?.v) continue;
        let fecha = cells[0]?.f || String(cells[0]?.v||'');
        const producto = String(cells[1]?.v||'').trim();
        const monto = parseFloat(cells[2]?.v)||0;
        if(!fecha || !producto || monto===0) continue;

        // Parse date
        let dateStr = fecha;
        if(fecha.includes('/')) {
          const pts = fecha.split('/');
          if(pts.length===3) dateStr = `${pts[2]}-${pts[1].padStart(2,'0')}-${pts[0].padStart(2,'0')}`;
        } else if(fecha.includes('-') && fecha.length===10) {
          dateStr = fecha;
        }

        const pk = producto.toLowerCase();
        let prodId = prodMap[pk];
        if(!prodId) {
          const { data: np } = await sb.from('products').insert({user_id:currentUser.id,name:producto,active:true,price_usd:0}).select().single();
          if(np) { prodId=np.id; prodMap[pk]=prodId; }
        }
        if(!prodId) { skipped++; continue; }

        const { data: dup } = await sb.from('daily_records').select('id').eq('user_id',currentUser.id).eq('product_id',prodId).eq('date',dateStr).eq('revenue_usd',monto).limit(1);
        if(dup&&dup.length>0) { skipped++; continue; }

        await sb.from('daily_records').insert({user_id:currentUser.id,product_id:prodId,date:dateStr,revenue_usd:monto,ad_spend_usd:0,net_profit_usd:monto,currency_code:'USD'});
        imported++;
      } catch(e) { skipped++; }
    }
    res.innerHTML = `<div class="sync-result ok">✅ ${imported} registros importados · ${skipped} omitidos (duplicados o sin datos)</div>`;
  } catch(e) {
    res.innerHTML = `<div class="sync-result err">❌ Error: ${e.message}</div>`;
  }
}

// ---- CONFIG ----
async function renderConfig() {
  const c = $('content');
  const { data: rates } = await sb.from('currency_config').select('*').eq('user_id',currentUser.id);
  const rm = { CLP:950, ARS:1420, VES:620 };
  (rates||[]).forEach(r => { rm[r.currency_code]=r.rate_to_usd; });

  c.innerHTML = `
  <div style="margin-bottom:18px"><div class="sec-title">Configuración</div></div>
  <div class="card">
    <div class="card-title">💱 Tasa del día</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Actualiza la tasa de conversión a USD.</p>
    <div class="rate-grid">
      ${['CLP','ARS','VES'].map(code => `
        <div class="rate-card">
          <div class="rate-lbl">${code} → USD</div>
          <input class="rate-inp" type="number" id="rate-${code}" value="${rm[code]}"/>
          <div class="rate-ref">1 USD = <span id="rate-ref-${code}">${rm[code]}</span> ${code}</div>
        </div>`).join('')}
    </div>
    <button class="btn-sm pu" style="margin-top:14px" onclick="saveRates()">Guardar tasas</button>
  </div>
  <div class="card">
    <div class="card-title">👤 Mi cuenta</div>
    <p style="font-size:13px;color:var(--text2)">Email: <strong style="color:var(--text)">${currentUser.email}</strong></p>
    <p style="font-size:13px;color:var(--text2);margin-top:6px">Plan: <strong style="color:var(--purple)">${currentProfile?.plan||'free'}</strong></p>
  </div>`;

  ['CLP','ARS','VES'].forEach(code => {
    $(`rate-${code}`)?.addEventListener('input', e => { const ref = $(`rate-ref-${code}`); if(ref) ref.textContent = e.target.value; });
  });
}

async function saveRates() {
  for(const code of ['CLP','ARS','VES']) {
    const val = parseFloat($(`rate-${code}`)?.value)||0;
    await sb.from('currency_config').upsert({user_id:currentUser.id,currency_code:code,rate_to_usd:val,updated_at:new Date().toISOString()},{onConflict:'user_id,currency_code'});
  }
  showToast('✓ Tasas guardadas');
}

}

// INIT
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if(session?.user) { await initApp(session.user); }
}

init();
</script>
